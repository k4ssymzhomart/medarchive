# MedPartners. Один up поднимает весь стек (раздел 12).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medpartners}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medpartners}
      POSTGRES_DB: ${POSTGRES_DB:-medpartners}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5544}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medpartners}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6399}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/data/storage
      # Реальный справочник и архив доступны внутри контейнера для seed/ingest.
      - "./docs:/app/docs:ro"
      - "./Справочник услуг.xlsx:/app/Справочник услуг.xlsx:ro"
    ports:
      - "${APP_PORT:-8088}:8000"
    command: >
      sh -c "alembic upgrade head &&
             python -m app.cli seed-reference 'Справочник услуг.xlsx' &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/data/storage
    command: celery -A app.celery_app.celery worker --loglevel=info --concurrency=2

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5577}:80"

volumes:
  postgres_data:
  redis_data:
  storage_data:
