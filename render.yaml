# MedPartners на Render (Blueprint, FREE-вариант).
# Все сервисы на бесплатном тарифе: Postgres (free), бэкенд (web, free),
# фронтенд (static, free). Без воркера и без Redis: для демо на восстановленном
# дампе БД они не нужны.
#
# Деплой: Render Dashboard -> New -> Blueprint -> подключить репозиторий ->
# ветка main -> ввести ключи (sync:false) -> Apply.
#
# ВАЖНО про URL: Render даёт адреса вида https://<имя>.onrender.com. Если имена
# заняты и Render добавит суффикс, обнови VITE_API_URL (фронт) и
# API_CORS_ORIGINS (бэк) на фактические адреса и пересобери фронт.
#
# Замечания по free-тарифу:
#  - Free web-сервисы засыпают после простоя; первый запрос будит их (10-30 с).
#    Перед демо открой бэкенд и фронт заранее, чтобы прогреть.
#  - Free Postgres: 1 ГБ, срок жизни 30 дней. Для демо достаточно.
#  - preDeployCommand на free недоступен, поэтому миграции и сид справочника
#    вынесены в dockerCommand. Команды идемпотентны.
#  - Загрузка новых прайсов через UI (/upload) на free не работает: нет
#    воркера и Redis. Демо-данные заливаются восстановлением дампа БД
#    (см. DEPLOY_RENDER.md). Поиск, нормализация, верификация, история цен и
#    дашборд работают полностью.

databases:
  - name: medpartners-db
    databaseName: medpartners
    user: medpartners
    plan: free
    postgresMajorVersion: "16"
    # pgvector создаётся миграцией (CREATE EXTENSION IF NOT EXISTS vector) —
    # managed Postgres на Render это поддерживает.

services:
  # --- Бэкенд: FastAPI + конвейер нормализации (Docker, free) ---
  - type: web
    name: medpartners-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: free               # 512 МБ RAM; для отдачи API на восстановленном дампе достаточно
    region: frankfurt        # ближе к KZ; при желании oregon
    healthCheckPath: /health
    # На free нет preDeployCommand, поэтому миграции и сид справочника кладём в
    # команду запуска. Идемпотентно: alembic не двигает уже накатанную схему,
    # seed-reference делает upsert. $PORT задаёт Render.
    dockerCommand: >-
      sh -c "alembic upgrade head &&
      python -m app.cli seed-reference 'Справочник услуг.xlsx' &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medpartners-db
          property: connectionString
      - key: API_CORS_ORIGINS
        value: https://medpartners-frontend.onrender.com
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_DIR
        value: /data/storage
      - key: PYTHONUNBUFFERED
        value: "1"
      # Дешёвая модель арбитра нормализации.
      - key: LLM_ARBITER_MODEL
        value: gpt-4o-mini
      # --- Ключи (задать в дашборде, в репозиторий НЕ коммитятся) ---
      # Все опциональны: без них работают код-матч + точное + fuzzy + FTS-поиск;
      # с OPENAI включаются эмбеддинги и арбитр (семантическая нормализация).
      - key: OPENAI_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  # --- Фронтенд: лендинг (/) + продукт (/app) как статический сайт (free) ---
  - type: web
    name: medpartners-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # База API на этапе сборки. Должна указывать на бэкенд выше.
      - key: VITE_API_URL
        value: https://medpartners-backend.onrender.com
    routes:
      # SPA: любые маршруты отдаём index.html (React Router).
      - type: rewrite
        source: /*
        destination: /index.html
