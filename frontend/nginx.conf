server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Большие заголовки/куки (на localhost куки делятся между проектами и
    # дефолтного буфера не хватает -> 400 Request Header Or Cookie Too Large).
    large_client_header_buffers 8 32k;

    # Раздача SPA: неизвестные пути отдаём index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование API на бэкенд с удалением префикса /api.
    # Резолвер Docker (127.0.0.11) + переменная в proxy_pass заставляют nginx
    # резолвить DNS на каждый запрос. Иначе при рестарте backend меняет IP, а
    # nginx держит старый -> 502 Bad Gateway.
    # ВАЖНО: при переменной в proxy_pass nginx НЕ срезает префикс location и не
    # подставляет URI автоматически. Поэтому используем regex-локацию с захватом
    # пути ($1) и собираем апстрим-URI явно: путь без /api/ + строка запроса.
    # Иначе все запросы уходят на корень бэкенда и возвращают мета-ответ.
    location ~ ^/api/(.*)$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Кэш статических ассетов с хешами имён.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
